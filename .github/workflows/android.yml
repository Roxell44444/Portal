name: Build PORTAL Android
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: |
          flutter create --platforms=android --project-name=portal build_workspace
          cp pubspec.yaml build_workspace/pubspec.yaml
          cp analysis_options.yaml build_workspace/analysis_options.yaml
          rm -rf build_workspace/lib build_workspace/test
          cp -R lib build_workspace/lib
          if [ -d test ]; then cp -R test build_workspace/test; fi
          sed -i '/<application/i\    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.INTERNET" />' build_workspace/android/app/src/main/AndroidManifest.xml
      - name: Resolve packages
        working-directory: build_workspace
        run: flutter pub get
      - name: Analyze
        working-directory: build_workspace
        run: flutter analyze
      - name: Test
        working-directory: build_workspace
        run: flutter test
      - name: Build APK
        working-directory: build_workspace
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
      - uses: actions/upload-artifact@v4
        with:
          name: portal-android-apk
          path: build_workspace/build/app/outputs/flutter-apk/app-release.apk
